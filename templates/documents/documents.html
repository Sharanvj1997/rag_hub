{% extends "base.html" %}
{% load static %}
{% block content %}

{% include "partials/navbar.html" %}

<div class="container pb-5" style="max-width: 960px;">
  <h1 class="h3 mb-1">Documents</h1>
  <p class="text-muted mb-4">PDF, TXT or MD files up to 10 MB. Each file is read in the background. Once it shows Ready, you can chat with it.</p>

  <div id="upload-status" class="alert d-none"></div>

  <form id="upload-form" class="panel p-3 d-flex flex-column flex-sm-row gap-2 mb-4">
    <input type="file" id="file-input" class="form-control" accept=".pdf,.txt,.md" required>
    <button type="submit" class="btn btn-primary px-4">Upload</button>
  </form>

  <div id="documents-list"></div>
</div>

<script src="{% static 'js/auth.js' %}"></script>
<script src="{% static 'js/documents.js' %}"></script>
{% endblock %}
