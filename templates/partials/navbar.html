  <div class="container">
    <a class="navbar-brand" href="/dashboard/">RAG Knowledge Hub</a>

    <ul class="navbar-nav flex-row gap-3 me-auto ms-4">
      <li class="nav-item"><a class="nav-link" href="/dashboard/">Dashboard</a></li>
      <li class="nav-item"><a class="nav-link" href="/documents/">Documents</a></li>
      <li class="nav-item"><a class="nav-link" href="/chat/">Chat</a></li>
    </ul>

    <div class="d-flex align-items-center gap-3">
      <span id="nav-username" class="text-muted"></span>
      <button id="logout-btn" class="btn btn-outline-danger btn-sm">Logout</button>
    </div>
  </div>
</nav>

<script>
  // Arrow function: looks up logoutUser at click time, so script order doesn't matter
  document.getElementById("logout-btn").addEventListener("click", () => logoutUser());

  document.querySelectorAll(".navbar .nav-link").forEach((link) => {
    if (link.getAttribute("href") === window.location.pathname) {
      link.classList.add("active", "fw-semibold");
    }
  });
</script>
